<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immich Pet Tagger - Starting</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --border: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --text2: #9a9a9a;
    --accent: #7c6af7;
    --danger: #c94a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 10% 10%, #1d1d1d 0%, var(--bg) 50%);
    color: var(--text);
    font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: min(560px, 92vw);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .title {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .sub {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.45;
    margin-bottom: 12px;
  }
  .status {
    font-size: 12px;
    color: var(--text2);
    min-height: 16px;
  }
  .status.error { color: var(--danger); }
  .bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 12px;
  }
  .bar > span {
    display: block;
    width: 30%;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    animation: load 1.2s ease-in-out infinite;
  }
  @keyframes load {
    0% { transform: translateX(-140%); }
    100% { transform: translateX(420%); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Immich Pet Tagger</div>
    <div class="sub">Starting services and loading models. This page refreshes automatically when the app is ready.</div>
    <div class="status" id="status">Checking startup status...</div>
    <div class="bar"><span></span></div>
  </div>
<script>
let pollTimer = null;
let inFlight = false;
let navigating = false;
let consecutiveFailures = 0;
let pollCount = 0;
let lastPollTime = 0;
const MAX_POLLS = 200;
const BASE_DELAY = 3000;
const MAX_DELAY = 15000;
const MIN_POLL_INTERVAL = 2000; // Absolute minimum 2s between requests

function stopPolling() {
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = null;
  }
  navigating = true;
  inFlight = false;
}

function getBackoffDelay(failures) {
  // Exponential backoff: 3s, 5s, 8s, 12s, 15s (capped)
  const delay = Math.min(BASE_DELAY + (failures * 2000), MAX_DELAY);
  return delay;
}

function schedulePoll(delayMs) {
  if (pollTimer) clearTimeout(pollTimer);
  if (navigating) return;
  if (pollCount >= MAX_POLLS) {
    const statusEl = document.getElementById('status');
    statusEl.className = 'status error';
    statusEl.textContent = 'Server startup timeout. Please refresh the page manually.';
    inFlight = false;
    return;
  }
  
  // Enforce minimum interval since last poll
  const timeSinceLastPoll = Date.now() - lastPollTime;
  const effectiveDelay = Math.max(delayMs, MIN_POLL_INTERVAL - timeSinceLastPoll);
  
  pollTimer = setTimeout(() => {
    if (navigating || inFlight) return; // Double-check before proceeding
    checkReady();
  }, effectiveDelay);
}

async function checkReady() {
  // Strict guard against concurrent requests
  if (navigating || inFlight) return;
  
  const statusEl = document.getElementById('status');
  inFlight = true;
  pollCount++;
  lastPollTime = Date.now();
  
  try {
    const r = await fetch('/api/status', { 
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    });
    if (!r.ok) throw new Error('Status endpoint not reachable yet');
    const s = await r.json();
    
    if (s.init_error) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Startup error: ' + s.init_error;
      inFlight = false; // Clean up flag so user can refresh
      return;
    }
    
    if (s.ui_ready) {
      stopPolling();
      window.location.replace('/app');
      return;
    }
    
    // Success - reset failure counter and use base delay
    consecutiveFailures = 0;
    const parts = [];
    parts.push('YOLO ' + (s.yolo_ready ? 'ready' : 'loading'));
    parts.push('CLIP ' + (s.clip_ready ? 'ready' : 'loading'));
    statusEl.className = 'status';
    statusEl.textContent = parts.join(' | ');
    inFlight = false;
    schedulePoll(BASE_DELAY);
  } catch (err) {
    // Failure - increment counter and use backoff
    consecutiveFailures++;
    const delay = getBackoffDelay(consecutiveFailures);
    statusEl.className = 'status';
    statusEl.textContent = 'Waiting for server... (retry in ' + Math.round(delay/1000) + 's)';
    inFlight = false;
    schedulePoll(delay);
  }
}

// Stop polling when the page is being unloaded or hidden
window.addEventListener('beforeunload', stopPolling);
window.addEventListener('pagehide', stopPolling);
window.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // Pause polling when tab is hidden (includes prefetch/prerender)
    if (pollTimer) {
      clearTimeout(pollTimer);
      pollTimer = null;
    }
  } else if (!navigating && !inFlight && !pollTimer) {
    // Resume when tab becomes visible again
    schedulePoll(BASE_DELAY);
  }
});

// Initial check - but ONLY if page is actually visible
// This prevents polling when Chrome prefetches the page in background
setTimeout(() => {
  if (!navigating && !inFlight && !document.hidden) {
    checkReady();
  }
}, 100);
</script>
</body>
</html>
